# We have conf, distro and recipes-* directories, so add LAYERDIR to BBPATH
# (this is what makes conf/distro/dashboard.conf findable).
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-dashboard"
BBFILE_PATTERN_meta-dashboard = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-dashboard = "6"

# This layer carries a qtshadertools bbappend and a Qt6 application, targets
# Raspberry Pi hardware, and the Qt layer itself needs openembedded-layer and
# meta-python. Declaring these makes a missing layer a clear error at parse
# time instead of a confusing "nothing provides" later.
LAYERDEPENDS_meta-dashboard = "core swiftboot qt6-layer openembedded-layer meta-python"
LAYERSERIES_COMPAT_meta-dashboard = "scarthgap"

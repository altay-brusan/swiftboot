# swiftboot - a minimal Linux distro that boots to a single fullscreen
# application as fast as the hardware allows.
#
# Board-agnostic by design. Everything hardware-specific lives in
# conf/distro/include/board/<MACHINE>.inc, pulled in at the bottom of this
# file. Adding a new board means adding one file there - nothing in this file
# changes.
#
# Build with:
#   DISTRO  ?= "swiftboot"
#   MACHINE ?= "raspberrypi3-64"     (or any board with an include/board file)

require conf/distro/poky.conf

DISTRO = "swiftboot"
DISTRO_NAME = "swiftboot"
DISTRO_VERSION = "1.0"
MAINTAINER = "altay.bn@gmail.com"
SDK_VENDOR = "-swiftbootsdk"

# NOTE: TARGET_VENDOR is deliberately NOT set here.
# Overriding it (e.g. to "-swiftboot") changes the toolchain triplet from
# aarch64-poky-linux to aarch64-swiftboot-linux, which invalidates EVERY
# sstate artifact and rebuilds gcc-cross and all of userspace from scratch.
# It buys nothing but cosmetics. Leave poky's "-poky" alone.

require conf/distro/include/swiftboot-boot.inc
require conf/distro/include/swiftboot-graphics.inc

# Per-board settings. `include` (not `require`) so an unknown MACHINE is not
# an error - it just gets the board-agnostic defaults above.
include conf/distro/include/board/${MACHINE}.inc

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "swiftboot"
BBFILE_PATTERN_swiftboot = "^${LAYERDIR}/"
BBFILE_PRIORITY_swiftboot = "7"

# Deliberately depends on core only. This layer is board-agnostic: per-board
# settings live in conf/distro/include/board/<MACHINE>.inc and are pulled in
# with `include`, which is silent when the file is absent. That is what lets
# the same distro target a Raspberry Pi today and a BeagleBone tomorrow
# without the layer knowing about either in advance.
LAYERDEPENDS_swiftboot = "core"
LAYERSERIES_COMPAT_swiftboot = "scarthgap"
